<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Employee List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body class="bg-dark">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-light border-bottom border-secondary pb-2">Employee List</h2>

        <a th:href="@{/employees/form}" class="btn btn-outline-info">+ Add New Employee</a>
    </div>
    <table class="table table-dark table-striped table-hover shadow">
        <tr>
            <th class="text-center">FirstName</th>
            <th class="text-center">LastName</th>
            <th class="text-center">Email</th>
            <th class="text-center">Department</th>
            <th class="text-center">Gender</th>
            <th class="text-center">Skills</th>
            <th class="text-center">Location</th>
            <th class="text-center">Action</th>
        </tr>
        <tr th:each="employee:${employee}">
            <td class="text-center" th:text="${employee.firstName}"></td>
            <td class="text-center" th:text="${employee.lastName}"></td>
            <td class="text-center" th:text="${employee.email}"></td>
            <td class="text-center" th:text="${employee.department}"></td>
            <td class="text-center" th:text="${employee.gender}"></td>
            <td class="text-center" th:text="${employee.skills}"></td>
            <td class="text-center" th:text="${employee.location}"></td>
            <td class="text-center">
                <a th:href="@{/employees/update(employeeId=${employee.id})}" class="btn btn-outline-info">Update</a>
                <a th:href="@{/employees/delete(employeeId=${employee.id})}" class="btn btn-outline-danger"
                   onclick="return confirm('Are you sure you want to delete this employee?')">Delete</a>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
