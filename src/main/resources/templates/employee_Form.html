<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">
<div class="container mt-5">
    <form th:action="@{/employees/save}" th:object="${employee}" method="post" class="bg-white p-4 rounded-4 shadow mx-auto" style="max-width: 600px;">

        <h2 class="text-center text-primary fw-bold mb-4">Employee Register Form</h2>
        <!-- ID -->
        <input type="hidden" th:field="*{id}">
        <!-- First Name -->
        FirstName :<input type="text" th:field="*{firstName}" class="form-control mb-2">

        <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="text-danger small d-block mb-3"></span>

        <!-- Last Name -->
        LastName :<input type="text" th:field="*{lastName}" class="form-control mb-2">

        <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="text-danger small d-block mb-3"></span>

        <!-- Email -->
        Email :<input type="text" th:field="*{email}" class="form-control mb-2">

        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small d-block mb-3"></span>

        <!-- Department -->
        <div class="mb-3">
        Department :<select th:field="*{department}" class="form-select mb-2">
            <option value="">--Select Department--</option>
            <option value="HR">HR</option>
            <option value="Development">Development</option>
            <option value="Sales">Sales</option>
            <option value="Marketing">Marketing</option>
        </select>

        <span th:if="${#fields.hasErrors('department')}" th:errors="*{department}" class="text-danger small d-block mb-3"></span>
        </div>

        <!-- Gender -->
        <div class="mb-3">
            Gender :<input type="radio" th:field="*{gender}" value="Male" class="form-check-input me-1"><label class="me-3">Male</label>

                    <input type="radio" th:field="*{gender}" value="Female" class="form-check-input me-1"><label class="me-3">Female</label>

                    <input type="radio" th:field="*{gender}" value="Others" class="form-check-input me-1"><label>Others</label>

            <span th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" class="text-danger small d-block"></span>
        </div>

        <!-- Skills -->
        <div class="mb-3">
            Skills :<input type="checkbox" th:field="*{skills}" value="Java" class="form-check-input me-1"><label class="me-3">Java</label>

                    <input type="checkbox" th:field="*{skills}" value="Python" class="form-check-input me-1"><label class="me-3">Python</label>

                    <input type="checkbox" th:field="*{skills}" value="JavaScript" class="form-check-input me-1"><label class="me-3">JavaScript</label>

                    <input type="checkbox" th:field="*{skills}" value="SQL" class="form-check-input me-1"><label>SQL</label>


            <span th:if="${#fields.hasErrors('skills')}" th:errors="*{skills}" class="text-danger small d-block"></span>
        </div>

        <!-- Location -->
        Location :<select th:field="*{location}" class="form-select mb-2">
            <option value="">--Location--</option>
            <option value="Vellore">Vellore</option>
            <option value="Chennai">Chennai</option>
            <option value="Bangalore">Bangalore</option>
            <option value="Mumbai">Mumbai</option>
        </select>

        <span th:if="${#fields.hasErrors('location')}" th:errors="*{location}" class="text-danger small d-block mb-4"></span>

        <!-- Submit -->
        <input type="submit" value="Register Employee" class="btn btn-primary w-100">

    </form>
</div>
</body>
</html>
